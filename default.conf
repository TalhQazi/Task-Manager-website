server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # ── Compression ──────────────────────────────────────────────────────────
    # The stock nginx image ships with gzip disabled, so every JS/CSS bundle was
    # being served at full size. Measured against the current build: 6.44 MB of
    # assets compress to 1.51 MB (76.6% saving).
    #
    # Compressing here (rather than only at the edge proxy) means the saving
    # holds regardless of the upstream proxy's gzip_types — nginx forwards an
    # already-encoded response untouched.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # ── Hashed build assets ──────────────────────────────────────────────────
    # Vite emits content-hashed filenames (index-DyrkLUrn.js), so the contents
    # at a given URL can never change. Without Cache-Control the browser
    # revalidates every file on every navigation — a full round-trip each, for
    # bytes it already has.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Other static files keep their hash-free names, so revalidate but allow reuse.
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ── SPA entry point ──────────────────────────────────────────────────────
    # index.html must NEVER be cached: it carries the references to the hashed
    # bundles, so a stale copy pins the browser to a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
